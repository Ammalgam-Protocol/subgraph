# This entity is solely for transfers outside of normal protocol interaction
# e.g. transferring depositL (collateral) directly, not a deposit.
# Transfers associated with other transactions in this schema should live there and not here.
# Note that only one transfer event should be created per transfer.
type Transfer implements Event @entity(immutable: true) @transaction {
  " { Transaction hash }-{ Log index } "
  id: ID!

  " Transaction hash of the transaction that emitted this event "
  hash: Bytes!

  " Nonce of the transaction that emitted this event "
  nonce: BigInt!

  " Event log index. For transactions that don't emit event, create arbitrary index starting from 0 "
  logIndex: Int!

  " Price of gas in this transaction "
  gasPrice: BigInt

  " Gas used in this transaction. (Optional because not every chain will support this) "
  gasUsed: BigInt

  " Gas limit of this transaction. e.g. the amount of gas the sender will pay "
  gasLimit: BigInt

  " Block number of this event "
  blockNumber: BigInt!

  " Timestamp of this event "
  timestamp: BigInt!

  " The user that sent the tokens "
  sender: User!

  " The user that received the tokens "
  receiver: User!

  " The pool for which transfer token belongs to "
  pool: Pool!

  " The sender user position changed by this event "
  senderPosition: Position!

  " The receiver user position changed by this event "
  receiverPosition: Position!

  " Lending Token for which the transfer is emitted "
  asset: LendingToken!

  " Amount of token transferred in native units "
  amount: BigInt!

  #### Addons ####

  shares: BigInt!
}

type Swap @entity(immutable: true) @transaction {
  " { Transaction hash }-{ Log index } "
  id: ID!

  " Transaction hash of the transaction that emitted this event "
  hash: Bytes!

  " Nonce of the transaction that emitted this event "
  nonce: BigInt!

  " Event log index. For transactions that don't emit event, create arbitrary index starting from 0 "
  logIndex: Int!

  " Price of gas in this transaction "
  gasPrice: BigInt

  " Gas used in this transaction. (Optional because not every chain will support this) "
  gasUsed: BigInt

  " Gas limit of this transaction. e.g. the amount of gas the sender will pay "
  gasLimit: BigInt

  " Block number of this event "
  blockNumber: BigInt!

  " Timestamp of this event "
  timestamp: BigInt!

  " The pool for where the user has swapped the tokens "
  pool: Pool!

  " Underlying tokenX in the pool "
  tokenX: Token!

  " Underlying tokenY in the pool "
  tokenY: Token!

  " sender of the swap "
  sender: User!

  " the EOA that initiated the txn "
  from: User!

  " recipient of the swap "
  to: User!

  " amount of tokenX transferred in native units "
  amountXIn: BigInt!

  " amount of tokenY transferred in native units "
  amountYIn: BigInt!

  " amount of tokenX transferred out in native units "
  amountXOut: BigInt!

  " amount of tokenY transferred out in native units "
  amountYOut: BigInt!
}

