specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AmmalgamFactory
    network: sepolia
    source:
      abi: AmmalgamFactory
      address: "0xBd68dbE675d0d1108af3aEbC5F7724Cf31c82E9a"
      startBlock: 7769243
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - Pool
        - Token
        - LendingToken
        - User
        - Position
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ./abis/ERC20NameBytes.json
        - name: ERC4626Debt
          file: ./abis/ERC4626Debt.json
        - name: ERC4626Deposit
          file: ./abis/ERC4626Deposit.json
        - name: ERC20DebtLiquidity
          file: ./abis/ERC20DebtLiquidity.json
        - name: ERC20DepositLiquidity
          file: ./abis/ERC20DepositLiquidity.json
        - name: AmmalgamFactory
          file: ./abis/AmmalgamFactory.json
        - name: AmmalgamPair
          file: ./abis/AmmalgamPair.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handlePairCreated
templates:
  - kind: ethereum/contract
    name: AmmalgamPair
    network: sepolia
    source:
      abi: AmmalgamPair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - Pool
        - Token
        - LendingToken
        - User
        - Position
      abis:
        - name: AmmalgamPair
          file: ./abis/AmmalgamPair.json
      eventHandlers:
        - event: Sync(uint256,uint256)
          handler: handleSync
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
  - kind: ethereum/contract
    name: ERC4626Deposit
    network: sepolia
    source:
      abi: ERC4626Deposit
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - Pool
        - Token
        - LendingToken
        - User
        - Position
      abis:
        - name: ERC4626Deposit
          file: ./abis/ERC4626Deposit.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
  - kind: ethereum/contract
    name: ERC20DepositLiquidity
    network: sepolia
    source:
      abi: ERC20DepositLiquidity
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - Pool
        - Token
        - LendingToken
        - User
        - Position
      abis:
        - name: ERC20DepositLiquidity
          file: ./abis/ERC20DepositLiquidity.json
      eventHandlers:
        - event: Mint(indexed address,indexed address,uint256)
          handler: handleDepositLiquidity
        - event: Burn(indexed address,indexed address,uint256)
          handler: handleWithdrawLiquidity
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
  - kind: ethereum/contract
    name: ERC4626Debt
    network: sepolia
    source:
      abi: ERC4626Debt
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - Pool
        - Token
        - LendingToken
        - User
        - Position
      abis:
        - name: ERC4626Debt
          file: ./abis/ERC4626Debt.json
      eventHandlers:
        - event: Borrow(indexed address,indexed address,uint256,uint256)
          handler: handleBorrow
        - event: Repay(indexed address,indexed address,uint256,uint256)
          handler: handleRepay
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
  - kind: ethereum/contract
    name: ERC20DebtLiquidity
    network: sepolia
    source:
      abi: ERC20DebtLiquidity
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/index.ts
      entities:
        - Pool
        - Token
        - LendingToken
        - User
        - Position
      abis:
        - name: ERC20DebtLiquidity
          file: ./abis/ERC20DebtLiquidity.json
      eventHandlers:
        - event: BorrowLiquidity(indexed address,uint256,indexed address)
          handler: handleBorrowLiquidity
        - event: RepayLiquidity(indexed address,indexed address,uint256)
          handler: handleRepayLiquidity
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
