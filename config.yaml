# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: ammalgam-indexer-sepolia
description: Ammalgam Protocol Indexer (Sepolia)
address_format: lowercase

field_selection:
  transaction_fields:
    - hash
    - from
    - to

contracts:
  - name: AmmalgamFactory
    handler: src/handlers/factory.ts
    events:
      - event: "LendingTokensCreated(address indexed pair, address depositL, address depositX, address depositY, address borrowL, address borrowX, address borrowY)"
      - event: "PairCreated(address indexed tokenX, address indexed tokenY, address pair, uint256 allPairsLength)"
      - event: "NewFeeToSetter(address indexed feeToSetter)"
      - event: "NewFeeTo(address indexed feeTo)"

  - name: AmmalgamPair
    handler: src/handlers/pair.ts
    events:
      - event: "Sync(uint256 reserveXAssets, uint256 reserveYAssets)"
      - event: "Swap(address indexed sender, uint256 amountXIn, uint256 amountYIn, uint256 amountXOut, uint256 amountYOut, address indexed to)"
      - event: "Liquidate(address indexed borrower, address indexed to, uint256 actualRepaidXAssets, uint256 actualRepaidYAssets, uint256 liquidationType)"
      - event: "InterestAccrued(uint256 reserveXAssets, uint256 reserveYAssets, uint112 depositXAssets, uint112 depositYAssets, uint112 borrowLAssets, uint112 borrowXAssets, uint112 borrowYAssets)"
      - event: "BurnBadDebt(address indexed borrower, uint256 indexed tokenType, uint256 badDebtAssets, uint256 badDebtShares)"
      - event: "UpdateExternalLiquidity(uint112 externalLiquidity)"

  - name: ERC4626Deposit
    handler: src/handlers/deposit.ts
    events:
      - event: "Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)"
      - event: "Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets, uint256 shares)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  - name: ERC20DepositLiquidity
    handler: src/handlers/depositLiquidity.ts
    events:
      - event: "Mint(address indexed sender, address indexed to, uint256 assets, uint256 shares)"
      - event: "Burn(address indexed sender, address indexed to, uint256 assets, uint256 shares)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  - name: ERC4626Debt
    handler: src/handlers/borrow.ts
    events:
      - event: "Borrow(address indexed sender, address indexed to, uint256 assets, uint256 shares)"
      - event: "Repay(address indexed sender, address indexed onBehalfOf, uint256 assets, uint256 shares)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  - name: ERC20DebtLiquidity
    handler: src/handlers/borrowLiquidity.ts
    events:
      - event: "BorrowLiquidity(address indexed sender, address indexed to, uint256 assets, uint256 shares)"
      - event: "RepayLiquidity(address indexed sender, address indexed onBehalfOf, uint256 assets, uint256 shares)"
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"

  - name: TimelockController
    events:
      - event: "CallScheduled(bytes32 indexed id, uint256 indexed index, address target, uint256 value, bytes data, bytes32 predecessor, uint256 delay)"
      - event: "CallExecuted(bytes32 indexed id, uint256 indexed index, address target, uint256 value, bytes data)"
      - event: "MinDelayChange(uint256 oldDuration, uint256 newDuration)"
      - event: "Cancelled(bytes32 indexed id)"
      - event: "RoleGranted(bytes32 indexed role, address indexed account, address indexed sender)"
      - event: "RoleRevoked(bytes32 indexed role, address indexed account, address indexed sender)"

  - name: BeaconController
    events:
      - event: "RoleGranted(bytes32 indexed role, address indexed account, address indexed sender)"
      - event: "RoleRevoked(bytes32 indexed role, address indexed account, address indexed sender)"
      - event: "AllowedAdded(address indexed implementation, address indexed by)"
      - event: "AllowedRemoved(address indexed implementation, address indexed by)"

  - name: UpgradeableBeacon
    events:
      - event: "Upgraded(address indexed implementation)"

  - name: SaturationAndGeometricTWAPState
    events:
      - event: "Upgraded(address indexed implementation)"
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"

  - name: ProxyAdmin
    events:
      - event: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"

chains:
  - id: 11155111  # Sepolia
    start_block: 12167736
    contracts:
      - name: AmmalgamFactory
        address: "0x923739b2bc46bb84bed1f9cb60e9d656917b3e9a"
      - name: TimelockController
        address: "0x6dc59cd3536a6ba3201885d7afde8709cdc1b617"
      - name: BeaconController
        address: "0x1c1690127847a8f4a8e699167e46b0f7068eb5a7"
      - name: UpgradeableBeacon
        address: "0x61b2345745e65dea5bfc7e003a6c9005b06b2a3f"
      - name: SaturationAndGeometricTWAPState
        address: "0x3942056802031419f73f3e9ae5a8960f8a20b87b"
      - name: ProxyAdmin
        address: "0x5a8dc641c92162fc91a5d8255617e0067e430fc1"
      - name: AmmalgamPair
      - name: ERC4626Deposit
      - name: ERC20DepositLiquidity
      - name: ERC4626Debt
      - name: ERC20DebtLiquidity
