name: CI
on:
  push: { branches: [main, feature/envio] }
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm check
      - run: pnpm tsc --noEmit
      - run: pnpm test:coverage
  integration:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Integration replay (skips without token)
        env: { ENVIO_API_TOKEN: "${{ secrets.ENVIO_API_TOKEN }}" }
        run: |
          if [ -z "$ENVIO_API_TOKEN" ]; then echo "No ENVIO_API_TOKEN — skipping L3"; exit 0; fi
          pnpm codegen && pnpm test:integration
